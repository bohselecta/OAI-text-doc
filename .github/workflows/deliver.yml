name: Materialize and verify Document
on:
  push:
    branches: [feat/document-language-canvas]
    paths: ['.delivery/manifest.json', '.github/workflows/deliver.yml']
permissions:
  contents: write
concurrency:
  group: document-initial-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'bohselecta/OAI-text-doc'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify exact locally tested source and safely extract
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, tarfile
          root=pathlib.Path('.').resolve()
          manifest=json.loads(pathlib.Path('.delivery/manifest.json').read_text())
          expected='85edf1526385374e6b7f6f4b9d3f9fb573d9e74bae75e298fb64dfa604c01fce'
          assert manifest == {'sha256': expected, 'parts': 6}
          encoded=''.join(pathlib.Path(f'.delivery/part-{i:02}.b64').read_text().strip() for i in range(6))
          payload=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(payload).hexdigest()==expected, 'Transport integrity mismatch'
          with tarfile.open(fileobj=io.BytesIO(payload),mode='r:xz') as archive:
              for member in archive.getmembers():
                  target=(root/member.name).resolve()
                  assert member.isfile() and target.is_relative_to(root)
                  assert not any(p in ['.git','.delivery','data','node_modules'] for p in pathlib.PurePosixPath(member.name).parts)
              archive.extractall(root,filter='data')
          PY
          git apply --check .delivery/browser-csp.patch
          git apply .delivery/browser-csp.patch
          python - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(pathlib.Path('docs/evidence/local-verification.json').read_text())
          for name,digest in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest, name
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run benchmark
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Native browser acceptance and real screenshots
        run: python tests/browser.py
      - name: Record observed evidence and commit normal source files
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          p=pathlib.Path('docs/evidence')
          shutil.copyfile('test-results/browser.json',p/'native-browser.json')
          report=json.loads((p/'native-browser.json').read_text())
          assert report['passed']==15 and report['pageErrors']==[] and report['providerCalls']==0
          assert report['mode'].startswith('native Chromium')
          (p/'native-ci.md').write_text('# Native browser CI\n\nObserved successful native Chromium navigation, HTTP, CSP loading and real downloads. All 15 browser behavior groups passed, with zero page errors and zero provider calls. Node 24 unit/integration tests and runtime packaging also passed in this run.\n\nRun: '+os.environ['RUN_URL']+'\n\nTransport commit: '+os.environ['INPUT_SHA']+'\n\nBase archive SHA-256: `85edf1526385374e6b7f6f4b9d3f9fb573d9e74bae75e298fb64dfa604c01fce`, followed by the reviewed CSP-polling test patch. Every runtime/test source hash was checked against the updated local verification manifest before execution. The first native attempt exposed string-based Playwright polling blocked by the application CSP; the polling helper was corrected without changing application policy or weakening assertions.\n\nThese checks do not establish live provider quality, host integration, production readiness or executed licensing.\n')
          PY
          rm -rf .delivery
          git config user.name 'Document delivery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md .env.example .gitignore package.json package-lock.json README.md LICENSE.md SECURITY.md THIRD_PARTY_NOTICES.md src tests scripts docs legal
          git add -u
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'Deliver tested Document module, native browser evidence and product README'
          git push origin HEAD:feat/document-language-canvas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: document-initial-verification
          path: |
            test-results/
            docs/images/*.png
            dist/manifest.json
          retention-days: 14
